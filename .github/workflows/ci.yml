name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            packages: g++-14
            compiler: g++-14
            preset: gcc-debug
          - name: clang
            packages: clang-18 libc++-18-dev libc++abi-18-dev libclang-rt-18-dev
            compiler: clang++-18
            preset: clang-debug
            cxx_flags: -stdlib=libc++
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.packages }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Decoder fuzz smoke (10000 executions)
        if: matrix.name == 'clang'
        run: |
          cmake --build --preset clang-debug --target laminar_format_fuzz
          mkdir -p build/fuzz-corpus
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 build/clang-debug/tests/laminar_format_fuzz -seed=70406 -runs=10000 -max_len=16384 -timeout=5 -artifact_prefix=build/ build/fuzz-corpus build/clang-debug/tests/fuzz-seeds

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [sanitizers, thread-sanitizer]
    name: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install --yes g++-14
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: find include src tests bench -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang tools
        run: sudo apt-get update && sudo apt-get install --yes clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev
      - name: Configure
        run: cmake --preset clang-tidy -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_CXX_CLANG_TIDY=clang-tidy-18
      - name: Analyze while building
        run: cmake --build --preset clang-tidy
